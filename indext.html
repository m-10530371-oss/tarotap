<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot AI | 命运之轮</title>
    <style>
        :root {
            --bg-dark: #0f0c29;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.08);
            --accent-gold: #ffd700;
            --accent-purple: #9d50bb;
            --text-main: #f0f0f0;
            --text-dim: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- 头部 --- */
        header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .lang-btn:hover { background: var(--accent-gold); color: #000; }

        /* --- 主容器 --- */
        main {
            flex: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- 通用卡片容器 --- */
        .glass-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        /* --- 表单样式 --- */
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: var(--accent-gold); font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #555;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-purple); outline: none; }

        .btn-action {
            background: linear-gradient(45deg, var(--accent-purple), #6e48aa);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(157, 80, 187, 0.4);
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(157, 80, 187, 0.6); }

        /* --- 抽牌区域 --- */
        .deck-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .card-back {
            width: 55px;
            height: 96px;
            background-image: repeating-linear-gradient(135deg, #1f1f1f, #1f1f1f 10px, #2a2a2a 10px, #2a2a2a 20px);
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card-back:hover { transform: translateY(-10px); border-color: var(--accent-gold); z-index: 10; }
        .card-back.selected { opacity: 0; pointer-events: none; }

        /* --- 结果报告布局 (重点优化部分) --- */
        .report-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .user-query { font-style: italic; color: var(--text-dim); }

        .cards-display-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .card-visual {
            width: 140px;
            animation: fadeIn 1s ease;
        }
        .card-visual img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid transparent;
        }
        .card-visual p { margin: 8px 0 0; font-size: 0.9rem; color: var(--accent-gold); }

        /* 详细解读列表 */
        .analysis-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            text-align: left;
        }
        @media(min-width: 768px) { .analysis-container { grid-template-columns: repeat(3, 1fr); } }

        .analysis-card {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 20px;
            border-top: 3px solid var(--accent-purple);
        }
        .analysis-card h3 { margin-top: 0; color: var(--accent-gold); font-size: 1.1rem; }
        .analysis-card .card-name { font-weight: bold; color: #fff; margin-bottom: 10px; display: block; font-size: 1.2rem;}
        .analysis-card .meaning { font-size: 0.95rem; color: #ddd; line-height: 1.6; }

        /* 总结框 */
        .final-advice {
            margin-top: 30px;
            background: linear-gradient(to right, rgba(157, 80, 187, 0.2), rgba(0,0,0,0));
            padding: 25px;
            border-left: 5px solid var(--accent-gold);
            text-align: left;
            border-radius: 0 10px 10px 0;
        }
        .final-advice h3 { color: var(--accent-gold); margin-top: 0; }

        /* --- 底部 --- */
        footer {
            text-align: right;
            padding: 20px;
            font-size: 0.8rem;
            color: #666;
            background: rgba(0,0,0,0.8);
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            pointer-events: none;
        }
        .author { pointer-events: auto; margin-right: 25px; color: var(--text-dim); }

        /* 辅助类 */
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Loading 动画 */
        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent-gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<header>
    <h1>🔮 Tarot Insight</h1>
    <button class="lang-btn" onclick="toggleLanguage()">中文 / English</button>
</header>

<main>
    <!-- 阶段 1: 用户输入 -->
    <section id="stage-input" class="glass-panel fade-in">
        <h2 id="txt-welcome">开启您的命运占卜</h2>
        <div class="form-group">
            <label id="lbl-theme">占卜主题 (Theme)</label>
            <input type="text" id="user-theme" placeholder="例如：感情、工作发展...">
        </div>
        <div class="form-group">
            <label id="lbl-question">心中疑惑 (Your Question)</label>
            <textarea id="user-question" rows="3" placeholder="请在此专注输入您想询问的具体问题..."></textarea>
        </div>
        <div class="form-group">
            <label id="lbl-spread">选择牌阵 (Spread)</label>
            <select id="user-spread">
                <option value="time">三牌阵 (过去 / 现在 / 未来)</option>
                <option value="triangle">圣三角 (盲点 / 现状 / 结果)</option>
                <option value="core">核心阵 (核心 / 阻碍 / 建议)</option>
            </select>
        </div>
        <button class="btn-action" onclick="processInput()" id="btn-start">开始连接能量</button>
    </section>

    <!-- 阶段 2: AI 分析中 -->
    <section id="stage-loading" class="glass-panel hidden">
        <div class="loading-spinner"></div>
        <h3 id="txt-analyzing">AI 正在解析星象与问题能量...</h3>
        <p id="txt-calc-res" style="color: var(--accent-gold); margin-top: 15px;"></p>
    </section>

    <!-- 阶段 3: 抽牌 -->
    <section id="stage-draw" class="glass-panel hidden">
        <h2 id="txt-instruction">请凭直觉抽取 3 张牌</h2>
        <p id="txt-count" style="color: var(--accent-purple); font-weight: bold;">0 / 3</p>
        <div class="deck-grid" id="deck-container"></div>
    </section>

    <!-- 阶段 4: 结果报告 -->
    <section id="stage-result" class="glass-panel hidden">
        <div id="report-content"></div> <!-- JS将在这里生成整齐的HTML -->
        <button class="btn-action" onclick="location.reload()" id="btn-restart">重新占卜</button>
    </section>
</main>

<footer>
    <div class="author">Author: Bryan Lye Wai Meng</div>
</footer>

<script>
    /* ================= 数据层 ================= */
    // 图片源：GitHub Raw (稳定)
    const IMG_ROOT = "https://raw.githubusercontent.com/tardisnomad/tarot-api/master/static/cards/";
    
    // 构建 78 张牌数据
    const deck = [];
    const suits = [
        { id: 'w', cn: '权杖', en: 'Wands' },
        { id: 'c', cn: '圣杯', en: 'Cups' },
        { id: 's', cn: '宝剑', en: 'Swords' },
        { id: 'p', cn: '星币', en: 'Pentacles' }
    ];
    // Major Arcana
    const majorsCn = ["愚人","魔术师","女祭司","皇后","皇帝","教皇","恋人","战车","力量","隐士","命运之轮","正义","倒吊人","死神","节制","恶魔","高塔","星星","月亮","太阳","审判","世界"];
    const majorsEn = ["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Strength","The Hermit","Wheel of Fortune","Justice","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];

    // 1. 生成大阿卡纳 (m00 - m21)
    for(let i=0; i<22; i++) {
        let code = i < 10 ? `m0${i}` : `m${i}`;
        deck.push({
            img: `${IMG_ROOT}${code}.jpg`,
            nameCn: majorsCn[i],
            nameEn: majorsEn[i],
            type: 'major',
            meanCn: "象征重大的人生课题、宇宙法则或不可抗拒的命运力量。",
            meanEn: "Symbolizes major life lessons, karmic influences, and archetypal themes."
        });
    }
    // 2. 生成小阿卡纳 (w01 - w14 等)
    const ranksCn = ['王牌','2','3','4','5','6','7','8','9','10','侍从','骑士','皇后','国王'];
    const ranksEn = ['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
    
    suits.forEach(suit => {
        for(let i=1; i<=14; i++) {
            let numStr = i < 10 ? `0${i}` : `${i}`;
            let code = `${suit.id}${numStr}`;
            deck.push({
                img: `${IMG_ROOT}${code}.jpg`,
                nameCn: `${suit.cn}${ranksCn[i-1]}`,
                nameEn: `${ranksEn[i-1]} of ${suit.en}`,
                type: 'minor',
                meanCn: `代表日常生活中的具体事件，涉及${suit.cn}层面的能量流动。`,
                meanEn: `Represents daily events and energy flow related to ${suit.en}.`
            });
        }
    });

    /* ================= 语言包 ================= */
    const i18n = {
        zh: {
            welcome: "开启您的命运占卜",
            theme: "主题 (Theme)",
            ques: "心中疑惑 (Question)",
            spread: "选择牌阵",
            btnStart: "开始连接能量",
            analyzing: "AI 正在解析星象与问题能量...",
            calcRes: "AI 计算完成：此问题需要抽取 3 张牌进行解析。",
            instr: "请凭直觉抽取 3 张牌",
            count: "已选:",
            btnRestart: "重新占卜",
            reportTitle: "🔮 命运启示报告",
            queryLabel: "您的提问",
            posNames: {
                time: ["过去 (根源)", "现在 (现状)", "未来 (趋势)"],
                triangle: ["盲点 (潜意识)", "现状 (显意识)", "结果 (综合)"],
                core: ["核心问题", "阻碍/帮助", "行动建议"]
            },
            labels: {
                cardName: "牌面",
                meaning: "核心含义",
                advice: "AI 建议",
                summaryTitle: "🔮 AI 综合解读与建议"
            },
            aiTemplates: {
                majorAdvice: "这是一张大阿卡纳牌，意味着此处有深层的精神课题需要您重视。",
                minorAdvice: "这是一张小阿卡纳牌，提示您关注生活中的细节与行动。",
                summary: "综合来看，这组牌展示了清晰的能量流动。请重点关注第一张牌所揭示的根源，它往往是解决问题的钥匙。保持内心的平静，跟随直觉行动。"
            }
        },
        en: {
            welcome: "Start Your Tarot Reading",
            theme: "Theme",
            ques: "Question",
            spread: "Select Spread",
            btnStart: "Connect Energy",
            analyzing: "AI is analyzing cosmic alignment...",
            calcRes: "AI Calculation: Draw 3 cards for this reading.",
            instr: "Trust your intuition and pick 3 cards",
            count: "Selected:",
            btnRestart: "New Reading",
            reportTitle: "🔮 The Revelation Report",
            queryLabel: "Your Query",
            posNames: {
                time: ["Past (Root)", "Present (Status)", "Future (Trend)"],
                triangle: ["Blind Spot", "Current", "Result"],
                core: ["Core Issue", "Obstacle/Help", "Solution"]
            },
            labels: {
                cardName: "Card",
                meaning: "Meaning",
                advice: "AI Note",
                summaryTitle: "🔮 AI Final Summary"
            },
            aiTemplates: {
                majorAdvice: "This is a Major Arcana card, indicating a significant life lesson here.",
                minorAdvice: "This is a Minor Arcana card, suggesting focus on daily details and actions.",
                summary: "Overall, the spread shows a clear flow of energy. Pay attention to the root cause shown in the first card. Stay calm and follow your intuition."
            }
        }
    };

    /* ================= 逻辑控制 ================= */
    let curLang = 'zh';
    let selectedCards = [];
    let shuffledDeck = [];
    let userInput = { theme: '', ques: '', spread: 'time' };

    function toggleLanguage() {
        curLang = curLang === 'zh' ? 'en' : 'zh';
        renderUI();
    }

    function renderUI() {
        const t = i18n[curLang];
        document.getElementById('txt-welcome').innerText = t.welcome;
        document.getElementById('lbl-theme').innerText = t.theme;
        document.getElementById('lbl-question').innerText = t.ques;
        document.getElementById('lbl-spread').innerText = t.spread;
        document.getElementById('btn-start').innerText = t.btnStart;
        document.getElementById('txt-analyzing').innerText = t.analyzing;
        document.getElementById('txt-calc-res').innerText = t.calcRes;
        document.getElementById('txt-instruction').innerText = t.instr;
        document.getElementById('txt-count').innerText = `${t.count} ${selectedCards.length} / 3`;
        document.getElementById('btn-restart').innerText = t.btnRestart;

        // 选项文案更新
        const sel = document.getElementById('user-spread');
        sel.options[0].text = curLang === 'zh' ? "三牌阵 (过去 / 现在 / 未来)" : "Three Card (Past / Present / Future)";
        sel.options[1].text = curLang === 'zh' ? "圣三角 (盲点 / 现状 / 结果)" : "Holy Triangle (Blind Spot / Current / Result)";
        sel.options[2].text = curLang === 'zh' ? "核心阵 (核心 / 阻碍 / 建议)" : "Core Spread (Core / Obstacle / Solution)";
    }

    function processInput() {
        userInput.theme = document.getElementById('user-theme').value;
        userInput.ques = document.getElementById('user-question').value;
        userInput.spread = document.getElementById('user-spread').value;

        if(!userInput.theme || !userInput.ques) {
            alert(curLang==='zh' ? "请完整输入主题和问题" : "Please fill in Theme and Question");
            return;
        }

        // 切换界面 -> Loading
        document.getElementById('stage-input').classList.add('hidden');
        document.getElementById('stage-loading').classList.remove('hidden');

        // 模拟 AI 计算时间
        setTimeout(() => {
            document.getElementById('txt-analyzing').style.display = 'none';
            document.getElementById('txt-calc-res').style.opacity = 1;
            
            setTimeout(() => {
                document.getElementById('stage-loading').classList.add('hidden');
                document.getElementById('stage-draw').classList.remove('hidden');
                initDeck();
            }, 1500);
        }, 1500);
    }

    function initDeck() {
        const grid = document.getElementById('deck-container');
        grid.innerHTML = '';
        // 洗牌
        shuffledDeck = [...deck].sort(() => Math.random() - 0.5);
        
        shuffledDeck.forEach((card, idx) => {
            const div = document.createElement('div');
            div.className = 'card-back';
            div.onclick = () => pickCard(div, card);
            grid.appendChild(div);
        });
    }

    function pickCard(el, card) {
        if(selectedCards.length >= 3) return;
        
        el.classList.add('selected');
        selectedCards.push(card);
        const t = i18n[curLang];
        document.getElementById('txt-count').innerText = `${t.count} ${selectedCards.length} / 3`;

        if(selectedCards.length === 3) {
            setTimeout(generateReport, 800);
        }
    }

    // --- 核心：生成整齐的报告 ---
    function generateReport() {
        document.getElementById('stage-draw').classList.add('hidden');
        document.getElementById('stage-result').classList.remove('hidden');

        const t = i18n[curLang];
        const container = document.getElementById('report-content');
        const posNames = t.posNames[userInput.spread];

        // 1. 构建头部信息
        let html = `
            <div class="report-header">
                <h2>${t.reportTitle}</h2>
                <div class="user-query">
                    <p><strong>${t.theme}:</strong> ${userInput.theme}</p>
                    <p><strong>${t.ques}:</strong> "${userInput.ques}"</p>
                </div>
            </div>
        `;

        // 2. 构建图片展示区 (Row)
        html += `<div class="cards-display-row">`;
        selectedCards.forEach((card, i) => {
            html += `
                <div class="card-visual">
                    <img src="${card.img}" onerror="this.src='https://via.placeholder.com/150x250/000000/FFFFFF?text=Card+Error'">
                    <p>${posNames[i]}</p>
                </div>
            `;
        });
        html += `</div>`;

        // 3. 构建详细解读卡片 (Grid)
        html += `<div class="analysis-container">`;
        selectedCards.forEach((card, i) => {
            let cName = curLang === 'zh' ? card.nameCn : card.nameEn;
            let cMean = curLang === 'zh' ? card.meanCn : card.meanEn;
            let advice = card.type === 'major' ? t.aiTemplates.majorAdvice : t.aiTemplates.minorAdvice;

            html += `
                <div class="analysis-card fade-in" style="animation-delay: ${i*0.2}s">
                    <h3>📍 ${posNames[i]}</h3>
                    <span class="card-name">${cName}</span>
                    <p><strong>${t.labels.meaning}:</strong><br>${cMean}</p>
                    <p style="color:var(--accent-purple); font-size:0.9rem;"><strong>${t.labels.advice}:</strong><br>${advice}</p>
                </div>
            `;
        });
        html += `</div>`;

        // 4. 构建综合建议框
        html += `
            <div class="final-advice fade-in" style="animation-delay: 0.8s">
                <h3>${t.labels.summaryTitle}</h3>
                <p>${t.aiTemplates.summary}</p>
            </div>
        `;

        container.innerHTML = html;
    }

    // 初始化
    renderUI();
</script>

</body>
</html>
    // 初始化
    renderUI();
</script>

</body>

</html>
